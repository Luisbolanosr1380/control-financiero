<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sin conexión</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #F4EFE3; color: #0E2A24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    .card { max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #3d554f; margin: 0 0 20px; }
    button {
      font-size: 16px; padding: 14px 22px; border-radius: 10px; border: 0;
      background: #0E2A24; color: #FBF7EC; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sin conexión</h1>
    <p>No hay señal en este momento. Tus datos no se guardan en el teléfono: cuando vuelva la conexión, abrí de nuevo la pantalla.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
